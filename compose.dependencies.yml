services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plataforma_agentes}
      POSTGRES_USER: ${POSTGRES_USER:-plataforma_agentes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo de ambiente}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  waha:
    image: devlikeapro/waha:noweb-arm
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - .env.waha
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_BASE_URL: http://127.0.0.1:3000
      WAHA_PRINT_QR: "False"
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  postgres_data:
  redis_data:
  waha_sessions:
